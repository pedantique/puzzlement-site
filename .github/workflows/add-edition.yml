name: Add a puzzle edition

# The Wednesday form. Actions → "Add a puzzle edition" → Run workflow, pick the
# puzzle, paste its URL (Colorful Strands also takes just the slug or number),
# Run. The change is
# committed to catalog/catalog.json, GitHub Pages redeploys in about a minute,
# and the app picks it up on its next launch or foreground (hourly check).

on:
  workflow_dispatch:
    inputs:
      puzzle:
        description: "Which puzzle"
        required: true
        default: strands-colorful
        type: choice
        options:
          - strands-colorful
          - special-crossword
      edition:
        description: "The URL. Colorful Strands also accepts the slug (2026-09-16-1101) or just the number (1101); Special Crossword accepts its date (2026-09-17)"
        required: true
        type: string
      date:
        description: "Edition date yyyy-MM-dd (leave blank: taken from the slug, else the nearest Wednesday)"
        required: false
        type: string
permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update catalog.json
        id: update
        run: |
          set -e
          ARGS=("${{ inputs.edition }}" --puzzle "${{ inputs.puzzle }}")
          if [ -n "${{ inputs.date }}" ]; then ARGS+=(--date "${{ inputs.date }}"); fi
          python3 catalog/add_edition.py "${ARGS[@]}" | tee result.txt
          echo "summary=$(cat result.txt)" >> "$GITHUB_OUTPUT"

      - name: Validate JSON
        run: python3 -c "import json; json.load(open('catalog/catalog.json'))"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/catalog.json
          git commit -m "Catalog: ${{ steps.update.outputs.summary }}"
          git push
